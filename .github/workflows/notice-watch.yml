name: Watch GNU Notices

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/notice-watch.yml"
      - "scripts/watch_notices.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/notice-watch.yml"
      - "scripts/watch_notices.py"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      deliver:
        description: "Telegram 발송 및 상태 저장"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.deliver)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/watch_notices.py --preview

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deliver && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: gnu-notice-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch and checkpoint notices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watch_notices.py --commit-state
