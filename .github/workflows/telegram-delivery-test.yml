name: One-time Telegram delivery test

on:
  push:
    branches: ['verify/telegram-test-20261126']
    paths: ['.github/workflows/telegram-delivery-test.yml']

permissions:
  contents: read

jobs:
  send-test:
    if: github.actor == 'clustering-jun' && github.run_attempt == '1' && github.event.before == '555e384ce33742ea9410dd3a34254a5bdd64349b'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Send exactly one test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from scripts.watch_notices import telegram_send

          telegram_send("🔔 경상국립대 공지봇 테스트 알림\n텔레그램 수신 확인용 메시지입니다.", silent=False)
          print("Telegram sendMessage returned success.")
          PY
